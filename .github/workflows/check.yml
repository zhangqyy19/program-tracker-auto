name: Check programs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # manual run from the Actions tab, or from the site's "Check now" button
  push:
    paths:
      - "docs/programs.json"
      - "tracker/**"
      - ".github/workflows/check.yml"

permissions:
  contents: write

concurrency:
  group: check-programs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        run: python tracker/tracker.py

      - name: Commit status.json if it changed
        run: |
          git config user.name "program-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "status: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
